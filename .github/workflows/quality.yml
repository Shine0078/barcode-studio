name: Barcode Studio quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Verify barcode generation and print workflows
        run: npm test
      - name: Build production assets
        run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
